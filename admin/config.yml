backend:
  name: git-gateway
  branch: main

media_folder: "images/portfolio"
public_folder: "/images/portfolio"

collections:
  - name: "portfolio"
    label: "Portfolio"
    label_singular: "Projekt"
    folder: "_portfolio"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Tytuł projektu"
        name: "title"
        widget: "string"
      - label: "Kategoria"
        name: "category"
        widget: "select"
        options:
          - label: "Korekta"
            value: "korekta"
          - label: "Redakcja"
            value: "redakcja"
          - label: "Prace akademickie"
            value: "prace-akademickie"
          - label: "Teksty biznesowe"
            value: "teksty-biznesowe"
      - label: "Opis"
        name: "description"
        widget: "text"
      - label: "Rok"
        name: "year"
        widget: "string"
        default: "2025"
      - label: "Zdjęcie / okładka"
        name: "image"
        widget: "image"
        required: false
      - label: "Link do PDF"
        name: "pdf"
        widget: "string"
        required: false
        hint: "Wklej ścieżkę do pliku PDF lub zostaw puste"
      - label: "Widoczny na stronie"
        name: "published"
        widget: "boolean"
        default: true